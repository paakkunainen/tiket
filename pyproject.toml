[project]
name = "tiket"
version = "0.1.0"
description = "Create AI-written tickets in Jira / Azure DevOps from one CLI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "textual>=8.2.8",
]

[project.scripts]
tiket = "tiket.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
